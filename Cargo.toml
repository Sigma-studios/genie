[package]
name = "genie"
version = "0.1.0"
edition = "2024"
description = "Génie, a fast application launcher for Wayland"
license = "MIT"

[dependencies]
# The window: a layer surface drawn with egui. wayapp owns the Wayland
# connection and input translation, gpu.rs keeps one GPU device for every show.
wayapp = "0.4"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
raw-window-handle = "0.6"
smithay-client-toolkit = "0.21"
smithay-clipboard = "0.7"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
pollster = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

# Plugins.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.23"
sha2 = "0.11"
percent-encoding = "2"
unicode-normalization = "0.1"
mime_guess = "2"

# Icons.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.49", default-features = false }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }

[profile.release]
lto = "thin"
strip = true
